name: Claude review

# Automatic code review when a PR is opened or marked ready. Runs on the Claude subscription via the
# CLAUDE_CODE_OAUTH_TOKEN secret (create it with `claude setup-token`). To review again after new
# commits, comment `@claude review` on the PR (handled by claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped; PRs from forks get no secrets, so skip those too.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md first for project context and conventions,
            and the linked issue (if any) to check the PR does what it set out to do.

            Report only things worth acting on, most important first:
            1. Correctness bugs and regressions, including edge cases and error handling.
            2. Safety of an agent that acts on real accounts: permission tiers, approvals,
               anything that could send, delete or spend without the intended approval, headless
               `yolo` defaults, prompt-injection paths from email/chat content into tool calls.
            3. Secrets or personal data in code, logs, fixtures or test output.
            4. Leftover Z.ai / ZCode network calls or branding where the PR claims to remove them.
            5. Missing tests for changed behavior.

            Skip style nits that `pnpm lint` would catch, and do not restate what the diff does.
            Use inline comments for specific lines. Finish with one short summary comment that
            says whether you see blocking issues. If the PR looks good, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
