name: Claude

# Mention @claude in an issue, PR comment or review to ask a question, request a re-review, or have it
# make a change. It works on a branch and opens a PR; it never pushes to `secretariat` directly.
# Only users with write access to the repo can trigger it.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Installed so Claude can run the same checks CI runs before pushing.
      - uses: ./.github/actions/setup

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: secretariat
          claude_args: |
            --allowedTools "Bash(pnpm lint),Bash(pnpm lint:fix),Bash(pnpm typecheck),Bash(pnpm architecture:check:*),Bash(pnpm test:unit:affected),Bash(pnpm exec vitest run:*),Bash(pnpm exec oxfmt:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
